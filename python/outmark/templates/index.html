<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Outmark</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main id="app">
      <header class="top">
        <h1>Outmark</h1>
        <p class="tagline">Make a promise. Step away. Leave a mark.</p>
      </header>

      <section class="stage" aria-label="Commitment">
        <div class="panel" id="promise">
          <p id="status" role="status">Checking the local service…</p>
          <p id="model-note" hidden></p>

          <form id="setup">
            <fieldset class="choices">
              <legend>Minutes</legend>
              <label><input type="radio" name="duration" value="5"> 5</label>
              <label><input type="radio" name="duration" value="10" checked> 10</label>
              <label><input type="radio" name="duration" value="15"> 15</label>
            </fieldset>
            <fieldset class="choices categories">
              <legend>Category</legend>
              <label><input type="radio" name="category" value="walking" checked> Walking and movement</label>
              <label><input type="radio" name="category" value="nature_observation"> Nature observation</label>
              <label><input type="radio" name="category" value="quiet_outdoor"> Quiet outdoor time</label>
              <label><input type="radio" name="category" value="social"> Social connection</label>
              <label><input type="radio" name="category" value="outdoor_care"> Outdoor care or helping</label>
              <label><input type="radio" name="category" value="exploring"> Exploring a new place</label>
              <label><input type="radio" name="category" value="creative_observation"> Creative observation</label>
              <label><input type="radio" name="category" value="other"> Other offline experiences</label>
            </fieldset>
            <button type="submit" class="primary">Suggest an activity</button>
          </form>

          <section id="proposal" hidden>
            <p class="eyebrow">One suggestion</p>
            <h2 id="proposal-title"></h2>
            <p id="proposal-instructions" class="lead"></p>
            <p id="proposal-meta" class="meta"></p>
            <p id="proposal-question" class="question"></p>
            <div class="actions">
              <button type="button" id="accept" class="primary">Accept and start</button>
              <button type="button" id="reject">Another suggestion</button>
            </div>
          </section>

          <section id="active" hidden>
            <p class="eyebrow">Your promise</p>
            <h2 id="active-title"></h2>
            <p id="active-quest" class="lead"></p>
            <p id="active-meta" class="meta"></p>
            <div id="report-fields" hidden>
              <p id="active-question" class="question"></p>
              <label class="field" for="reflection">Reflection, if you want one</label>
              <textarea id="reflection" maxlength="280" rows="3"></textarea>
              <div class="actions">
                <button type="button" id="kept" class="primary">I kept it</button>
                <button type="button" id="not-kept">I did not keep it</button>
              </div>
            </div>
          </section>
        </div>

        <div class="panel clock" id="timer-slot">
          <div class="timer-face">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <circle class="ring-track" cx="60" cy="60" r="52"></circle>
              <circle id="ring" class="ring-value" cx="60" cy="60" r="52"></circle>
            </svg>
            <p id="timer" class="timer">10:00</p>
          </div>
          <p id="timer-state">Ready when you are.</p>
        </div>
      </section>

      <section id="board" class="panel">
        <div class="panel-head">
          <h2>Board</h2>
          <p id="history-range" class="meta"></p>
        </div>
        <div class="grid-scroll">
          <div id="grid" class="grid"></div>
        </div>
      </section>

      <details id="history" class="panel">
        <summary>Past activity</summary>
        <ul id="sessions"></ul>
      </details>
    </main>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
